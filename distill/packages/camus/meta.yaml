      Le Mythe de Sisyphe 末章 2、L'Étranger 开篇 3、L'Homme révolté 1、
      L'Été·Retour à Tipasa 1、La Peste 结尾 1。
      清单之外**不得自造法文原句**。
    ⚠️ 待办（公开发行前必须完成，不可跳过）：
      - **法务确认**：由法律意见书确认上述片段引用在目标发行地是否落入合理引用/引用权范围
