        并确认自行直译的衍生作品风险；未获确认前本包维持 status: ready-selfuse，不得公开发行。
      - 与 corpus.copyright_route 的三条替换方案一并评估（换公版哲学家 / 取得授权 / 索引式引用）。
  voice_layer: |
    persona.md §3b 声纹样本层（2026-09-05 新增）。因版权约束，本层与其他包的构成不同：
