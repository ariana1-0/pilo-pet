history:
  - "2026-09-05 依宪法 v2.1 与转述路线创建（第六包，Gate D 20/20，Gate A 19/19 PARA）。"
  - |
    2026-09-05 声纹修复（voice v2）。原因：用户试聊判定六个哲学家包"完全没有区分度，每个人说出来的话都一股 AI 味道"。
    根因诊断：只蒸馏了哲学立场与思维框架，没蒸馏**语言风格**；且所有引文都被转述成大白话，原句几乎不出现，风格信号被磨平。
    做法：①persona.md 新增 §3b 声纹样本层——8 句确知的法文片段（+ 自行直译 + 出处）、七组可复现句法标记
    （Il faut 断言体 / 白色写作短断句 / 地中海感官域替代抽象名词 / "荒谬是处境不是结论"的措辞硬规矩 /
    倔强的幸福语调与明确不承诺 / 他自己版本的"递出可反驳判断" / 三类串味反例）；
    ②两篇范例全部重写为片段引用 + 确知史实（守门员、十七岁结核与随之关闭的教师与兵役之路、
    1957 诺奖"更愿意给母亲"、贝尔库尔的厨房与不识字的母亲），删去被宪法 §2.3 禁用的统一例句"这笔账你可以驳我"；
    ③每篇批注新增"§11.1 结算"与"语感自检"，专项拆解与**尼采**（同谈肯定生命 → 尼采点火要你变强，加缪只要你不撒谎；
    尼采给疾病发勋章，加缪把病叫作日程表）和**马可**（同谈接受处境 → 马可分拣求安宁，加缪拒绝安宁、维持张力）的混淆风险；
    ④frontmatter 新增 quotes_used（本包无 corpus_id，改填书名 + 篇节，见 corpus.voice_layer）；
    ⑤meta.yaml 新增 corpus.fragment_quotation_policy（片段引用长度自律标准 + 自行直译要求 + 法务确认待办）。
    版权处理：用户"多放原句"的要求与著作权约束正面冲突，本次的解法是**单句级片段引用 + 自行直译 + 史实补足密度**，
    而非放宽引用长度；verify_quotes.py 仍报告 19 处锚点未经语料校验（预期状态，非回归）。
    遗留：status 保持 ready-selfuse，公开发行前须完成 fragment_quotation_policy 的法务确认待办。

content_grading:
