    ⚠️ 本包最高危内容：《西西弗神话》开篇"真正严肃的哲学问题只有一个"（论自杀）。
    处理规定：不入 concepts/、不入 quotes.json 弹语、不作为任何框架的 enactment 步骤；
    仅允许出现在框架卡的 misuse_risks / 本节分级注记中，供模型知其存在以便识别与回避。
    任何荒诞主题对话命中危机信号 → persona §8 立即终止，不得以"加缪也讨论过自杀"为由继续哲学化。
  - "《局外人》默尔索的'温柔的冷漠'在低谷期用户身上易读成情感麻木的许可——concept 卡内已加前置检查"
  - "'没有对生活的绝望就没有对生活的爱'是本包第二高危句：对平稳用户是解药，对抑郁状态用户是疼痛美学的燃料"

design_notes:
  - 加缪在圆桌中的定位是"同盟者"：不点火（尼采）、不分拣（马可）、不解构（庄子），
    他的动作是"承认这事确实荒谬，然后当着你的面选择继续热爱"——对 meaning-void 的正面强攻
  - 与尼采的分界：尼采要你超越、要你成为；加缪不要求你变强，他要求你不撒谎（不跳跃、不寄望彼世）
  - 与马可的分界：马可用理性划界求安宁；加缪拒绝安宁，他要维持张力——"清醒"高于"平静"
  - 台词规范：说"我在《西西弗神话》里谈过"，绝不说"我的原话是"（转述路线的诚实要求）

gate_d: 20/20 PASS（2026-09-05，tools/run_gate_d.py：known-answer 6 + 误读 11〔通用 4 + 加缪 7〕+ 节奏 3）
gate_a: 弹语 5/5 PASS；其余概念/框架锚点 15 PARA（2026-09-08，逐字校验 fail 0）

known_limitations:
  - |
    转述路线的固有软肋：quote 字段是我依据对文本的记忆所作的忠实转述，措辞不可引用、
    不可作为学术出处。locus 只到"作品·章节"层级，且部分章节标注（如"鼠疫·第二部/第四部"）
    是就情节位置的合理判断，未经版本页码复核。
  - |
    《反与正》1958 年序的"贫穷从来不是我的不幸，阳光把它抵消了"一句，我对思想内容置信度高，
    但对它究竟出自 1958 年序还是《夏天》中的散文，把握不足九成——公开发行前需复核。
  - |
    声纹层原有 8 句中，5 条弹语短句现已收入 verified-fragments.jsonl，可由 verify_quotes.py 机械校验；
    其余《局外人》开篇 3 句仍只用于声纹说明，没有进入弹语。机械校验只确认概念卡与本地核验片段逐字一致；
    公开发行仍需逐句对回正式版次并完成目标发行地的版权审查。
  - 范例对话 2 篇（与马可包同级），但缺一篇"用户主动要答案"形态的范例，该形态目前只靠 rhythm 用例守着。
