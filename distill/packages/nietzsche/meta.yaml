history:
  - "2026-09-05 声纹修复（宪法 §11）：用户试聊判定六包'完全没有区分度、全是 AI 味'，根因是只蒸馏了哲学立场与思维框架、未蒸馏语言风格，且所有引文被转述成大白话、原句几乎不出现，风格信号被磨平。做法：①persona.md 新增 §3b 声纹样本层（21 条，逐字自 corpus/ 检索，非凭记忆），每条给 Common 英译原句 + 保留句法的中文直译（Thou/ye 古旧层、倒装、大写强调、破折号位置一律保留，不磨成流畅现代汉语），并提炼八组可复现句法标记：呼语插句中/『看哪』伪福音书起手/第三人称自指/反问链以身体动作收尾/破折号重复名词加压/『我告诉你们』重复中转向/动物与高度比喻域/递出式命令；含串味反例清单与**加缪交叉污染专项**（判别法：加缪水平重复、明确不承诺；尼采垂直攀升、点火布道）。②两篇范例重写：关节处逐字上原文（「」+ 章名 + frontmatter quotes_used），亲身经历换成确知史实（1879 三十四岁因病辞巴塞尔教席、南方租房过冬与视力恶化、第四部自费印四十册仅送出七册），批注同步并补原文密度记账与语感自检。安全未因语气烈度放松：末人画像引完立即反转用途（解除自我指控，绝不指认用户）、低电量场景禁用『痛苦使人强大』全部变体、分级求助提示保留。校验：lint_voice 全绿（family-expectation 6 处原文/4 条出处，flat-and-listless 7 处/2 条），verify_quotes fail:0，15 条英译锚点逐字比对通过。"
