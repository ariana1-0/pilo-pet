        存疑、骑青牛出关是传说），改以经验域（水/婴儿/谷/器皿/车毂/木/绳约/江海/风/门户）
        承担同一交付形态。
      - exemplars/peer-comparison-offers.md 全文重写：三轮 7 处逐字原文（「」+ 章号，
