name: Build preview installers

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      service_url:
        description: Render 服务地址，例如 https://philo-pet-preview.onrender.com
        required: true
        default: https://pilo-pet.onrender.com
        type: string
  push:
    branches:
      - codex/preview-build

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run make:mac
            label: macOS-universal
          - os: windows-latest
            command: npm run make:win
            label: Windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/desktop
    env:
      PHILO_SERVICE_URL: ${{ inputs.service_url || 'https://pilo-pet.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: philo-pet-${{ matrix.label }}
          path: app/desktop/out/make/**/*
          if-no-files-found: error

  release:
    name: Publish stable download links
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: philo-pet-*
          path: downloaded
          merge-multiple: true
      - name: Prepare stable filenames
        shell: bash
        run: |
          mkdir -p release-assets
          mac_asset="$(find downloaded -type f -name '*.dmg' -print -quit)"
          win_asset="$(find downloaded -type f -iname '*Setup.exe' -print -quit)"
          test -n "$mac_asset" && test -n "$win_asset"
          cp "$mac_asset" release-assets/philo-pet-macOS-universal.dmg
          cp "$win_asset" release-assets/philo-pet-Windows-x64-Setup.exe
      - name: Create or refresh preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view preview-latest >/dev/null 2>&1; then
            gh release upload preview-latest release-assets/* --clobber
          else
            gh release create preview-latest release-assets/* \
              --target "$GITHUB_SHA" \
              --title "philo-pet 测试版" \
              --notes "供小范围测试使用。macOS 版本未签名，首次打开请按测试说明手动放行。" \
              --prerelease
          fi
