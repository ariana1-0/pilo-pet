<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="./pet.css" />
</head>
<body>
  <div id="pet-root">
    <!-- 弹语/对话气泡 -->
    <div id="bubble" class="bubble" hidden title="点击换一句弹语">
      <svg class="bubble-paper" viewBox="0 0 360 188" preserveAspectRatio="none" aria-hidden="true">
        <path class="paper-shadow" d="M40 13 C65 4 91 17 116 10 C143 1 163 16 190 11 C221 4 247 10 270 17 C298 15 329 31 337 55 C350 78 345 111 336 132 C328 153 308 165 286 169 L320 187 L273 176 C249 183 222 178 199 181 C171 186 145 176 119 181 C91 185 66 178 43 171 C22 165 12 146 16 126 C6 104 14 76 18 58 C22 38 27 24 40 13 Z"/>
        <path class="paper-fill" d="M37 10 C62 1 89 14 114 7 C141 -2 162 13 188 8 C219 1 246 7 269 14 C297 12 328 28 336 52 C349 75 343 108 334 129 C326 150 306 162 283 166 L317 184 L270 173 C247 180 219 175 197 178 C169 183 143 173 117 178 C89 182 64 175 41 168 C20 162 10 143 14 123 C4 101 13 73 16 55 C20 35 24 21 37 10 Z"/>
        <path class="paper-sketch" d="M39 12 C63 3 90 16 115 8 C141 0 163 15 189 10 C220 3 245 9 269 16 C298 13 326 29 334 54 C347 76 341 107 332 129 C324 149 304 160 281 165 L314 181 L269 171 C246 178 220 173 196 176 C169 181 144 171 117 176 C90 180 65 173 42 166 C22 160 12 142 16 123 C7 102 15 74 18 56 C22 36 27 23 39 12 Z"/>
        <path class="paper-fold" d="M316 22 L337 40 L317 37 Z M319 26 L333 38"/>
      </svg>
      <div class="bubble-content">
        <div class="bubble-body" id="bubble-body"></div>
        <div class="bubble-attribution" id="bubble-attribution" hidden></div>
        <div class="bubble-src" id="bubble-src" hidden></div>
      </div>
      <span class="bubble-spark" aria-hidden="true"></span>
    </div>
    <!-- 操作刻意放在纸片外，避免挤压名言与出处。 -->
    <div class="bubble-actions" id="bubble-actions" hidden></div>

    <!-- 角色形象：spritesheet 动画，可拖动 -->
    <div id="pet" class="pet" title="点我打开或关闭弹窗 · 按住拖动" aria-label="哲学猫桌宠">
      <div id="pet-sprite" class="pet-sprite" aria-hidden="true"></div>
    </div>
  </div>
  <script src="./pet.js"></script>
</body>
</html>
